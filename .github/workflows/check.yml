name: check profile assets

on:
  pull_request:
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/check.yml"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: install font dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: test streaks and render every card
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: rebuild static assets
        run: python scripts/gen_hero.py
      - name: check committed assets are current
        run: git diff --exit-code -- assets/
