name: profile cards

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 00:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cards.yml"
      - "scripts/gen_cards.py"
      - "scripts/stats.jpg"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: generate stats + calendar cards
        run: python scripts/gen_cards.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#b99cff&color_dots=#2a221a,#5c2a16,#9c3a18,#e0552a,#ff9660
            dist/snake-light.svg?palette=github-light&color_snake=#7c5cbf&color_dots=#f1e7d3,#f8c89a,#f08a4b,#d9481c,#a82a10

      - name: frame the snake like the calendar card
        run: python scripts/gen_cards.py snake

      - name: publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
